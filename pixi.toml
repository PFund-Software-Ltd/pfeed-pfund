[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfeed-pfund@gmail.com>"]
channels = ["conda-forge"]
name = "pfeed-pfund"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64"]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0d"

[pypi-exclude-newer]
uv_build = "0d"
afterpython = "0d"
pfund-blocks = "0d"
pfund-kit = "0d"
pfeed=  "0d"
pfund = "0d"

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  { task = "test", environment = "py315" },
]

[dependencies]

[pypi-dependencies]
pfeed = ">=0.0.20"
pfund = ">=0.0.25"

[environments]
default = ["py313", "dev", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]

[feature.dev.pypi-dependencies]
pfeed-pfund = { path = ".", editable = true }
pfeed = { path = "../..", editable = true }  # TEMP
pfund = { path = "../../../pfund", editable = true }  # TEMP
pfund-kit = { path = "../../../pfund-kit", editable = true }  # TEMP
afterpython = ">=0.4.0"

[feature.test.pypi-dependencies]
pfeed-pfund = { path = ".", editable = true }
pfeed = { path = "../..", editable = true }  # TEMP
pfund = { path = "../../../pfund", editable = true }  # TEMP
pfund-kit = { path = "../../../pfund-kit", editable = true }  # TEMP
pytest = ">=9.1.1"
pytest-mock = ">=3.16.0"
pytest-xdist = ">=3.8.0"
pytest-asyncio = ">=1.4.0"
# pytest-cov = ">=7.1.0"
# pytest-recording = ">=0.14.0"
[feature.test.tasks]
test = "pytest -n auto"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
