[project]
name = "pfeed-pfund"
version = "0.0.1.dev1"
description = "pfund as a data source plugin for pfeed"
readme = "README.md"
authors = [
    { name = "softwareentrepreneer", email = "softwareentrepreneer+pfeed-pfund@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pfeed>=0.0.20",
    "pfund>=0.0.25",
]

[project.scripts]
pfeed-pfund = "pfeed_pfund:main"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { uv_build = false, pfund-blocks = false, pfund-kit = false, pfeed = false, pfund = false }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
